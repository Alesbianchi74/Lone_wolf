<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lone Wolf Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<meta name="apple-mobile-web-app-title" content="Lone Wolf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF6EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#201C16" media="(prefers-color-scheme: dark)">
<link rel="preload" href="fonts/vollkorn.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Vollkorn';src:url('fonts/vollkorn.woff2') format('woff2');font-weight:400 900;font-style:normal;font-display:swap}
@font-face{font-family:'Vollkorn';src:url('fonts/vollkorn-italic.woff2') format('woff2');font-weight:400 900;font-style:italic;font-display:swap}
@font-face{font-family:'Alegreya Sans';src:url('fonts/alegreyasans-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Alegreya Sans';src:url('fonts/alegreyasans-400i.woff2') format('woff2');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'Alegreya Sans';src:url('fonts/alegreyasans-500.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Alegreya Sans';src:url('fonts/alegreyasans-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
</style>
<style>
:root{
  --bg:#F2EBDC;--surface:#FAF6EC;--sunk:#E6DCC6;--ink:#1F1B15;--muted:#5F574A;--line:#C8BDA5;--rule:#5A5040;
  --accent:#2D5A42;--on-accent:#EFF2E5;--gold:#8A6516;--blood:#982922;--ok:#2C6A3D;--veil:rgba(20,28,22,.55);
  --fd:'Vollkorn',Georgia,'Times New Roman',serif;
  --fi:'Vollkorn',Georgia,'Times New Roman',serif;
  --fs:'Alegreya Sans',-apple-system,system-ui,'Helvetica Neue',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17140F;--surface:#201C16;--sunk:#0F0D0A;--ink:#EDE5D3;--muted:#ABA18D;--line:#3D362B;--rule:#8F8470;
    --accent:#7EB494;--on-accent:#0D1610;--gold:#D5AE57;--blood:#E5695B;--ok:#7EC08F;--veil:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17140F;--surface:#201C16;--sunk:#0F0D0A;--ink:#EDE5D3;--muted:#ABA18D;--line:#3D362B;--rule:#8F8470;
  --accent:#7EB494;--on-accent:#0D1610;--gold:#D5AE57;--blood:#E5695B;--ok:#7EC08F;--veil:rgba(0,0,0,.65);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--fs);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px 10px}
.hrow{display:flex;align-items:flex-start;gap:10px}
.who{flex:1;min-width:0}
.nm{font:1.45rem/1.1 var(--fd);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk{font:italic .92rem/1.3 var(--fi);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.ib:disabled{opacity:.35}
.ib svg{width:22px;height:22px}
.ib.fate{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.hstats{display:grid;grid-template-columns:1fr 1.35fr .9fr;gap:12px;margin-top:8px;align-items:end}
.hs .l{display:block;font-size:.78rem;color:var(--muted)}
.hs .v{font:2rem/1 var(--fi);font-variant-numeric:lining-nums}
.hs .v small{font-size:1.05rem;color:var(--muted)}
.bar{height:5px;background:var(--sunk);border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bar.low i{background:var(--blood)}

/* layout */
main{padding:6px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:680px;margin:0 auto}
.sec{padding:18px 0 6px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h2{font:1.32rem/1.2 var(--fd);margin:0 0 4px;display:flex;align-items:baseline;gap:8px}
.sec h2 .cnt{margin-left:auto;font:italic .95rem var(--fi);color:var(--muted)}
.lead{color:var(--muted);font-size:.93rem;margin:0 0 10px}
.note{font-size:.88rem;color:var(--muted);margin:6px 0}
.warn{color:var(--blood)}
.banner{margin:14px 0 4px;padding:12px 14px;border-left:3px solid var(--gold);background:var(--surface);font-size:.95rem}
.banner b{font-weight:700}

/* ledger rows */
.ledger{list-style:none;margin:6px 0 10px;padding:0}
.ledger li{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line);padding:4px 0}
.ledger li:last-child{border-bottom:0}
.ledger .n{font:1rem var(--fi);color:var(--muted);width:20px;text-align:right;flex:none}
.ledger .t{flex:1;min-width:0}
.ledger .t small{display:block;color:var(--muted);font-size:.82rem;line-height:1.25}
.ledger .empty{color:var(--line);font-style:italic}
.ledger .acts{display:flex;gap:6px;flex:none}

/* buttons */
.btn{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--ink);background:transparent;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.dng{border-color:var(--blood);color:var(--blood)}
.btn.sm{min-height:36px;padding:5px 10px;font-size:.9rem;border-radius:8px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.x{width:36px;height:36px;border:0;background:transparent;color:var(--muted);font-size:1.3rem;border-radius:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.row.end{justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.chip{min-height:38px;padding:6px 12px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:.94rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip:disabled{opacity:.4}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.step button{width:42px;height:42px;border:0;background:transparent;font-size:1.25rem}
.step span{min-width:42px;text-align:center;font:1.25rem var(--fi)}
label.f{display:block;margin:8px 0}
label.f>span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=number],input:not([type]),select,textarea{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:130px;resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.25fr 1.15fr .8fr;gap:8px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:10px 0}
.stat .l{font-size:.85rem;color:var(--muted)}
.stat .v{font:2.6rem/1 var(--fi)}
.stat .v small{font-size:1.2rem;color:var(--muted)}
.brk{margin:6px 0 0;padding:0;list-style:none;font-size:.88rem;color:var(--muted)}
.brk li{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0}
.arts{list-style:none;padding:0;margin:8px 0}
.arts li{padding:9px 0;border-bottom:1px solid var(--line)}
.arts li:last-child{border-bottom:0}
.arts b{font:1.08rem var(--fd);font-weight:400}
.arts p{margin:2px 0 0;font-size:.9rem;color:var(--muted)}
.arts .perf{margin:4px 0 0;font-size:.88rem;color:var(--ink)}
.arts .perf em{color:var(--gold);font-style:normal;font-weight:700}
.tag{display:inline-block;font-size:.75rem;padding:1px 7px;border:1px solid var(--line);border-radius:9px;color:var(--muted);margin-left:6px;vertical-align:2px}
.tag.on{border-color:var(--gold);color:var(--gold)}

/* combat */
.foe{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.foe .t{flex:1}
.foe b{font:1.15rem var(--fd);font-weight:400}
.foe.cur{border-left:3px solid var(--blood);padding-left:10px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px;margin:16px 0 8px}
.vs .side .l{font-size:.82rem;color:var(--muted)}
.vs .side .v{font:2.4rem/1 var(--fi)}
.vs .ratio{font:italic .9rem var(--fi);color:var(--muted)}
.vs .ratio b{display:block;font:normal 2.8rem/1 var(--fi);color:var(--gold)}
.resbars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.big{min-height:58px;font:1.35rem var(--fd);border-radius:14px}
.log{list-style:none;padding:0;margin:8px 0;font-size:.9rem}
.log li{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:6px 0;border-bottom:1px dotted var(--line)}
.log .d{font:1.4rem/1 var(--fi);color:var(--gold);text-align:center}
.log .k{color:var(--blood);font-weight:700}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{border:0;background:transparent;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--muted);min-height:56px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs button.alert{color:var(--blood)}

/* overlays */
.veil{position:fixed;inset:0;z-index:50;background:var(--veil);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet h3{font:1.45rem var(--fd);margin:0 0 6px}
.full{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(30px + env(safe-area-inset-bottom,0px))}
.full .in{max-width:640px;margin:0 auto}
.full h1{font:2.1rem/1.05 var(--fd);margin:8px 0 4px}

/* Tabella del Destino */
.reel{position:relative;width:132px;height:176px;margin:6px auto 12px;perspective:560px;border-radius:16px;background:var(--surface);border:1.5px solid var(--ink);overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.reel.spin{cursor:default}
.drum{position:absolute;left:0;right:0;top:50%;height:0;transform-style:preserve-3d}
.face{position:absolute;left:0;right:0;top:-32px;height:64px;display:grid;place-items:center;font:3.4rem/1 var(--fi);color:var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:34%;z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(var(--surface),rgba(0,0,0,0))}
.reel::after{bottom:0;background:linear-gradient(rgba(0,0,0,0),var(--surface))}
.win{position:absolute;left:10px;right:10px;top:50%;height:66px;margin-top:-33px;border-top:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);z-index:3;pointer-events:none}
.reel.hit .face.cur{color:var(--accent)}
.rout{min-height:40px;margin-bottom:4px}
.rres{display:grid;gap:6px}
.rl{display:flex;align-items:baseline;gap:10px;padding:9px 12px;border-radius:10px;background:var(--surface);border-left:4px solid var(--line)}
.rl.me{border-left-color:var(--accent)}
.rl.foe{border-left-color:var(--blood)}
.rl .who{flex:1;min-width:0;font:1.08rem var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl b{font:1.55rem/1 var(--fi);color:var(--blood);white-space:nowrap}
.rl b.zero{color:var(--muted);font-size:1.1rem}
.rl small{color:var(--muted);font-size:.85rem;min-width:58px;text-align:right}
.rend{margin:10px 0 0;font:1.15rem var(--fd);color:var(--gold);text-align:center}
.rnum{text-align:center;font:1.15rem var(--fi);margin:0}
.rnum b{font-size:1.5rem;color:var(--accent)}
.sheet .lead b{color:var(--gold)}
.fate-r{display:flex;align-items:center;gap:16px;min-height:76px}
.fate-r .d{font:4.4rem/1 var(--fi);color:var(--gold);min-width:56px;text-align:center}
.fate-r .t{flex:1;color:var(--muted);font-size:.95rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.95rem;max-width:92vw;box-shadow:0 4px 18px rgba(0,0,0,.25);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.dead{text-align:center;padding:30px 0}
.dead h2{font:2rem var(--fd);color:var(--blood);margin:0 0 8px}
.journal{font:1.04rem/1.55 var(--fi)}
.journal>:first-child{margin-top:4px}
.jbook{font:1.35rem var(--fd);font-weight:400;margin:18px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.jbook small{display:block;font:italic .95rem var(--fi);color:var(--muted)}
.jpath{margin:6px 0;line-height:1.9}
.jpath i{color:var(--gold);margin:0 .3em;font-style:normal}
.jnote{margin:8px 0;padding:2px 0 2px 12px;border-left:2px solid var(--gold);font-style:italic}
.jnote small,.jcomb small{display:block;font:.8rem var(--fs);color:var(--muted);font-style:normal}
.jev{margin:8px 0;font:1.02rem var(--fd);color:var(--gold)}
.jcomb{margin:8px 0;padding:8px 12px;background:var(--surface);border-left:3px solid var(--blood);border-radius:0 10px 10px 0;font:.92rem/1.45 var(--fs)}
.jcomb ol{margin:4px 0;padding-left:22px;color:var(--muted)}
.jcomb .o{margin:2px 0 0;font-weight:700}
.mark{width:72px;height:72px;margin:0 auto 6px;display:block;color:var(--accent)}
/* tipografia Vollkorn, dimensioni e filetti */
html{font-size:17.5px}
*,*::before,*::after{font-variant-numeric:lining-nums!important}
body{font-size:18.5px}
.hrow{align-items:center}
.wolf{flex:none;display:block;height:3.1rem;color:var(--accent)}
.wolf svg{height:100%;width:auto;display:block}
.nm{font:600 1.75rem/1.05 var(--fd);letter-spacing:0}
.bk{font-size:1rem;margin-top:2px}
.hs .v,.stat .v,.vs .side .v,.vs .ratio b,.face,.log .d,.fate-r .d{font-weight:600}
.sec h2,.jbook,.full h1,.sheet h3,.dead h2,.foe b,.arts b,.rl .who,.big,.jev{font-weight:600}
.sec h2{font-size:1.42rem}
.top{border-bottom:0;padding-bottom:14px}
.hbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--line)}
.hbar i{display:block;height:100%;background:var(--accent);transition:width .35s ease,background-color .35s}
.hbar.low i{background:var(--blood)}
.sec{border-bottom:1.5px solid var(--rule)}
nav.tabs{border-top:3px solid var(--accent);padding-left:4px;padding-right:4px}
nav.tabs button{border-radius:0 0 14px 14px;margin-bottom:4px}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
nav.tabs button[aria-current="page"].alert{color:var(--on-accent)}
.top .ib{width:40px;height:40px}.top .ib svg{width:20px;height:20px}
.hacts{display:flex;gap:8px;align-self:end;padding-bottom:2px}
.hstats{grid-template-columns:.9fr 1.25fr .9fr auto}
nav.tabs button{font-size:.72rem;letter-spacing:-.01em}
nav.tabs button svg{width:28px;height:28px}
.mark{width:96px;height:auto}
.mark svg{width:100%;height:auto;display:block}
/* Altro: regole e mappe */
.big3 li{padding:0}
.bigrow{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 0;min-height:60px}
.bigrow b{display:block;font:600 1.3rem var(--fd)}
.bigrow small{color:var(--muted);font-size:.9rem}
.bigrow::after{content:"›";float:right;margin-top:-1.6em;font:1.6rem var(--fd);color:var(--gold)}
.maps li{align-items:flex-start;padding:10px 0}
.maps li.curbook{background:var(--surface);margin:0 -8px;padding:10px 8px;border-radius:10px}
.mthumb{flex:none;width:76px;height:56px;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sunk)}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block}
.maps .row a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
.mv{position:fixed;inset:0;z-index:70;background:#0c0b09;touch-action:none;overflow:hidden}
.mv img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.mvbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(12,11,9,.82);color:#EDE5D3}
.mvbar span{flex:1;font:600 1rem var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvbar .btn{border-color:#EDE5D3;color:#EDE5D3}
.mvbar .btn.pri{background:#EDE5D3;color:#17140F}
.rules .rtoc{margin:10px 0 6px;padding-left:1.4em;columns:1}
.rules .rtoc li{margin:2px 0}
.rules .rtoc button{border:0;background:transparent;padding:6px 0;font:600 1.08rem var(--fd);color:var(--accent);text-align:left}
.rsec{border-top:1.5px solid var(--rule);padding-top:12px;margin-top:16px}
.rsec h2{font:600 1.4rem var(--fd);margin:0 0 6px}
.rsec h3{font:600 1.15rem var(--fd);margin:14px 0 4px}
.rsec p{margin:6px 0}
.rsub{font:600 1rem var(--fd);color:var(--gold);margin:10px 0 2px!important}
.rl2{margin:6px 0;padding-left:1.25em}
.rl2 li{margin:4px 0}
.rdl dt{font:600 1.05rem var(--fd);margin-top:8px}
.rdl dt small{font:italic .85rem var(--fs);color:var(--muted);font-weight:400}
.rdl dd{margin:2px 0 0;color:var(--ink)}
.rt{border-collapse:collapse;margin:6px 0}
.rt th,.rt td{border-bottom:1px solid var(--line);padding:4px 16px 4px 0;text-align:left}
.rtop{margin-top:10px!important}

/* schermata iniziale */
.welcome{position:fixed;inset:0;z-index:40;overflow:auto;background:#244A36;color:#fff;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 7vh) 26px calc(env(safe-area-inset-bottom,0px) + 22px)}
.welcome>*{width:100%;max-width:520px}
.wtop{display:flex;flex-direction:column;align-items:center}
.wmark{display:block;width:125px;color:#F2EBDC}
.wmark svg{width:100%;height:auto;display:block}
.welcome h1{margin:20px 0 0;color:#fff;font-family:var(--fd);font-weight:600;line-height:1}
.welcome h1 span{display:block;font-size:3.1rem;letter-spacing:.005em}
.welcome h1 small{display:block;font-size:2.3rem;font-weight:500;margin-top:4px;color:#F2EBDC}
.wlead{margin:6vh auto 0;font-size:1.18rem;line-height:1.5;color:rgba(242,235,220,.88)}
.wbtns{display:flex;flex-direction:column;gap:12px;margin-top:5vh;margin-bottom:28px}

/* ====== STATO ====== */
const LSKEY='lupo-solitario-registro-v1';
let APP={slots:{},current:null,settings:{...DEFAULT_SETTINGS},settingsUpdated:0,tab:'pers'};
let UNDO=[];
const UI={loseN:1,loseCat:'ferita',gainN:1,create:null,wiz:null,sheet:null,lastRound:null};
const S=()=>APP.settings;
const C=()=>APP.slots[APP.current]||null;
function loadLocal(){try{const s=localStorage.getItem(LSKEY);if(s){const o=JSON.parse(s);APP.slots=o.slots||{};APP.current=o.current||null;APP.settings={...DEFAULT_SETTINGS,...(o.settings||{})};APP.settingsUpdated=o.settingsUpdated||0;APP.tab=o.tab||'pers'}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify({slots:APP.slots,current:APP.current,settings:APP.settings,settingsUpdated:APP.settingsUpdated,tab:APP.tab}))}catch(e){}}
function persist(id){saveLocal();queueCloud(id)}
function mutate(fn,undo=true){
  const c=C();if(!c)return;
  if(undo){UNDO.push(JSON.stringify(c));if(UNDO.length>40)UNDO.shift()}
  migrate(c);fn(c);normalize(c);c.updated=Date.now();persist(c.id);render();
}
function undo(){const s=UNDO.pop();if(!s)return;const o=JSON.parse(s);o.updated=Date.now();APP.slots[o.id]=o;APP.current=o.id;persist(o.id);render();toast('Ultima azione annullata')}
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const sum=(a,f)=>a.reduce((t,x)=>t+(f(x)||0),0);
const num=(v,d=0)=>{const n=parseInt(v,10);return Number.isFinite(n)?n:d};

/* ====== REGOLE DERIVATE ====== */
const isRamastan=c=>c.book>=6;
const rsN=c=>c.ramastan.length;
const has=(c,id)=>c.ramas.includes(id)||c.ramastan.includes(id);
const hasR=(c,id)=>c.ramastan.includes(id);
function circles(c){return CERCHI.filter(k=>k.a.every(a=>c.ramastan.includes(a)))}
function circ(c){const k=circles(c);return {c:sum(k,x=>x.c),r:sum(k,x=>x.r)}}
function rankName(c){return isRamastan(c)?(RAMASTAN_RANKS[rsN(c)-1]||'—'):(RAMAS_RANKS[c.ramas.length-1]||'—')}
function equippedSpecials(c){return c.specials.filter(s=>s.kind!=='faretra'&&(s.kind==='arma'?false:s.eq))}
function maxRes(c){return c.resBase+circ(c).r+sum(c.specials.filter(s=>s.eq&&s.kind!=='arma'),s=>s.res)}
function baseComb(c){return c.combBase+circ(c).c}
function idleComb(c){return baseComb(c)+sum(equippedSpecials(c),s=>s.comb)}
function canHeal(c){return c.ramas.includes('guarigione')||hasR(c,'medicina')}
function canHunt(c,desert){return hasR(c,'fiuto')||(c.ramas.includes('caccia')&&!desert)}
function mindShield(c){return c.ramas.includes('psicoschermo')||hasR(c,'scudo')}
function specialLimit(c){return (c.book>=8||S().specialLimitRetro)?12:Infinity}
function depositOpen(c){return c.book>=5&&!(S().depositLocked&&c.book>=9&&c.book<=12)}
function meals(c){return c.backpack.filter(i=>i.kind==='pasto').length}
function healCeil(c,src){const only=src==='potion'?S().potionOnlyWounds:S().healOnlyWounds;return maxRes(c)-(only?c.debt:0)}
function arciMed(c){return hasR(c,'medicina')&&rsN(c)>=9}
function arciMedReady(c,inCombat){return arciMed(c)&&!c.arciUsed&&c.resCur>0&&c.resCur<=6&&(inCombat||!S().arciMedCombatOnly)}
function migrate(c){if(!c)return;if(!c.journal)c.journal=[{k:'b',book:c.book}];if(c.notesLogged===undefined)c.notesLogged=c.notes||''}
function normalize(c){
  migrate(c);
  const m=maxRes(c);
  if(c.resCur>m)c.resCur=m;
  if(c.resCur<=0){c.resCur=0;if(c.status==='alive'){if(c.combat)endCombat(c,'morte');c.status='dead';c.combat=null;c.journal.push({k:'e',txt:'Lupo Solitario cade'+(c.para?' al paragrafo '+c.para.n:''),t:Date.now()})}}
  c.debt=Math.max(0,Math.min(c.debt,m-c.resCur));
  if(c.gold>50)c.gold=50;if(c.gold<0)c.gold=0;
  if(c.log.length>120)c.log=c.log.slice(-120);
  if(c.history.length>500)c.history=c.history.slice(-500);
}
function withMaxDelta(c,fn){const a=maxRes(c);fn();const b=maxRes(c);if(b!==a)c.resCur=b>a?c.resCur+(b-a):Math.max(1,c.resCur+(b-a))}
function loseRes(c,n,cat){if(n<=0)return;c.resCur-=n;if(cat==='stenti')c.debt+=n;if(c.para)c.para.lost=true}
function textHeal(c,n){c.resCur=Math.min(maxRes(c),c.resCur+n);c.debt=Math.max(0,c.debt-n)}

/* armi e bonus */
function weaponTypes(w){return w.sun?SWORDS:[w.type]}
function allWeapons(c){return [...c.weapons.map(w=>({...w,src:'arm'})),...c.specials.filter(s=>s.kind==='arma').map(s=>({id:s.id,name:s.name,type:s.wtype||'Altro',comb:s.comb||0,sun:!!s.sun,src:'spec'}))]}
function mastery(c,w){
  const t=weaponTypes(w);
  if(hasR(c,'guerra')&&t.some(x=>c.guerra.includes(x)))return ['Guerra ('+t.find(x=>c.guerra.includes(x))+')',rsN(c)>=8?4:3];
  if(c.ramas.includes('scherma')&&c.scherma&&t.includes(c.scherma))return ['Scherma ('+c.scherma+')',2];
  return null;
}
function unarmedMalus(c){if(hasR(c,'guerra')){if(rsN(c)>=8)return -1;if(rsN(c)>=5)return -2}return -4}
function psiInfo(c){
  const laser=c.ramas.includes('psicolaser')||hasR(c,'raggio');
  const arci=hasR(c,'raggio')&&rsN(c)>=9;
  return {laser,laserV:arci?3:2,raggio:hasR(c,'raggio'),raggioV:arci?6:4,cost:arci?1:2,min:arci?4:6};
}
function combatComb(c,cb,e){
  const parts=[];const w=cb.weapon?allWeapons(c).find(x=>x.id===cb.weapon):null;
  parts.push(['COMBATTIVITÀ di base',c.combBase]);
  const k=circ(c);if(k.c)parts.push(['Cerchi di Sapienza',k.c]);
  const realW=w&&w.type!=='Arco'?w:null;
  if(!realW)parts.push([w?'Solo arco: combatti disarmato':'Senza armi',unarmedMalus(c)]);
  else{if(w.comb)parts.push([w.name,w.comb]);const m=mastery(c,realW);if(m)parts.push(m)}
  const twoH=realW&&!realW.sun&&TWO_HANDED.includes(realW.type);
  for(const s of equippedSpecials(c)){if(!s.comb)continue;if(s.kind==='scudo'&&twoH){parts.push([s.name+' (non usabile con arma a due mani)',0]);continue}parts.push([s.name,s.comb])}
  const p=psiInfo(c);
  if(e&&!e.immune){if(cb.psi==='laser'&&p.laser)parts.push(['Psicolaser',p.laserV]);if(cb.psi==='raggio'&&p.raggio)parts.push(['Raggio Psichico',p.raggioV])}
  if(cb.alether)parts.push(['Pozione di Alether',cb.alether]);
  if(cb.mod)parts.push(['Modificatore dal testo',cb.mod]);
  if(cb.ambush){if(hasR(c,'fiuto'))parts.push(['Sorpresa o imboscata (ignorata: Fiuto)',0]);else parts.push(['Sorpresa o imboscata',cb.ambush])}
  return {total:sum(parts,x=>x[1]),parts,w:realW};
}
function bestWeapon(c){
  const cand=[null,...allWeapons(c).filter(w=>w.type!=='Arco').map(w=>w.id)];let best=null,bv=-99;
  for(const id of cand){const v=combatComb(c,{weapon:id,psi:'none'},null).total;if(v>bv){bv=v;best=id}}return best;
}

/* ====== CLOUD (account Claude) ====== */
const CLOUD={db:null,uid:null,status:'Connessione in corso…',pending:new Set(),settingsDirty:false,timer:null,busy:false};
const col=()=>CLOUD.db.collection('data/users/'+CLOUD.uid);
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function'){CLOUD.status='Salvataggio su questo dispositivo. Esporta ogni tanto un backup su iCloud Drive';refreshCloud();return}
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){CLOUD.status='Non disponibile: salvataggio solo sul dispositivo';refreshCloud();return}
    const id=await user.id();if(!id){CLOUD.status='Accedi a Claude per sincronizzare: salvataggio solo sul dispositivo';refreshCloud();return}
    CLOUD.db=db;CLOUD.uid=id;await cloudPull();
  }catch(e){CLOUD.status='Connessione non riuscita: salvataggio solo sul dispositivo';refreshCloud()}
}
async function cloudPull(){
  const snap=await col().get();const seen=new Set();let changed=false;
  for(const d of snap.docs){
    const v=d.data();if(!v)continue;
    if(d.id==='settings'){if((v.updated||0)>(APP.settingsUpdated||0)){try{APP.settings={...DEFAULT_SETTINGS,...JSON.parse(v.json)};APP.settingsUpdated=v.updated;changed=true}catch(e){}}else if(APP.settingsUpdated>(v.updated||0))CLOUD.settingsDirty=true;continue}
    if(!d.id.startsWith('slot_'))continue;
    const id=d.id.slice(5);seen.add(id);const loc=APP.slots[id];
    if(v.deleted){if(loc&&(loc.updated||0)<=(v.updated||0)){delete APP.slots[id];changed=true}else if(loc)CLOUD.pending.add(id);continue}
    if(!loc||(loc.updated||0)<(v.updated||0)){try{APP.slots[id]=JSON.parse(v.json);changed=true}catch(e){}}
    else if((loc.updated||0)>(v.updated||0))CLOUD.pending.add(id);
  }
  for(const id in APP.slots)if(!seen.has(id))CLOUD.pending.add(id);
  if(!APP.slots[APP.current]){APP.current=Object.keys(APP.slots).sort((a,b)=>(APP.slots[b].updated||0)-(APP.slots[a].updated||0))[0]||null;changed=true}
  CLOUD.status='Sincronizzato con il tuo account Claude';
  saveLocal();if(changed){UNDO=[];render()}else refreshCloud();
  if(CLOUD.pending.size||CLOUD.settingsDirty)queueCloud();
}
function queueCloud(id){if(id)CLOUD.pending.add(id);clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(flushCloud,1200)}
async function flushCloud(){
  if(!CLOUD.db||CLOUD.busy)return;CLOUD.busy=true;
  try{
    for(const id of [...CLOUD.pending]){
      CLOUD.pending.delete(id);const s=APP.slots[id];const ref=col().doc('slot_'+id);
      if(s)await ref.set({json:JSON.stringify(s),updated:s.updated||Date.now(),name:s.name,book:s.book});
      else await ref.set({deleted:true,updated:Date.now()});
    }
    if(CLOUD.settingsDirty){CLOUD.settingsDirty=false;await col().doc('settings').set({json:JSON.stringify(APP.settings),updated:APP.settingsUpdated||Date.now()})}
    const t=new Date();CLOUD.status='Sincronizzato alle '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  }catch(e){CLOUD.status='Sincronizzazione non riuscita: riprovo alla prossima modifica'}
  CLOUD.busy=false;refreshCloud();if(CLOUD.pending.size)queueCloud();
}

/* Rullo del Destino: cilindro con le cifre 0-9. Il numero è estratto con crypto, la rotazione viene calcolata per fermarsi su quella cifra. */
function drawReel(title,sub,o={}){
  return new Promise(res=>{
    if(!S().animateFate){res({d:rnd(10),again:false});return}
    const L=document.getElementById('layer');const v=document.createElement('div');v.className='veil';
    const H=64,RZ=(H/2)/Math.tan(Math.PI/10);
    const faces=Array.from({length:10},(_,i)=>`<div class="face" data-i="${i}" style="transform:rotateX(${-i*36}deg) translateZ(${RZ.toFixed(1)}px)">${i}</div>`).join('');
    v.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p class="lead">${o.pre||esc(sub||'Fai scorrere il rullo con il dito, oppure tocca Gira.')}</p>
      <div class="reel" id="reel" role="img" aria-label="Rullo del Destino"><div class="drum" id="drum">${faces}</div><div class="win"></div></div>
      <div class="rout" id="rout" aria-live="polite">${o.pre?'<p class="note" style="text-align:center">Fai scorrere il rullo con il dito, oppure tocca Gira.</p>':''}</div>
      <div class="row end" id="rbtn"><button class="btn" id="fx">Annulla</button><button class="btn pri" id="fspin">Gira</button></div></div>`;
    L.appendChild(v);
    const drum=v.querySelector('#drum'),reel=v.querySelector('#reel');let A=rnd(10)*36,state='idle',drag=null;
    const setA=x=>{A=x;drum.style.transform=`rotateX(${A.toFixed(2)}deg)`};setA(A);
    const close=r=>{v.remove();res(r)};
    const land=k=>{
      state='done';reel.classList.add('hit');const f=reel.querySelector(`.face[data-i="${k}"]`);if(f)f.classList.add('cur');
      v.querySelector('#rout').innerHTML=o.describe?o.describe(k):`<p class="rnum">È uscito il <b>${k}</b></p>`;
      const b=v.querySelector('#rbtn');
      b.innerHTML=o.describe&&o.canAgain&&o.canAgain(k)?`<button class="btn" data-r="0">Applica</button><button class="btn pri" data-r="1">Applica e nuovo scontro</button>`:`<button class="btn pri" data-r="0">${o.describe?'Applica':'Usa questo numero'}</button>`;
      b.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>close({d:k,again:x.dataset.r==='1'}));
      b.querySelector('.pri').focus();
    };
    const spin=vel=>{
      state='spin';reel.classList.add('spin');v.querySelector('#fspin').disabled=true;v.querySelector('#fx').disabled=true;
      const k=rnd(10),dir=vel<0?-1:1,speed=Math.min(3,Math.max(.5,Math.abs(vel)));
      const turns=Math.round(1+speed*2)+rnd(2);
      const cur=((A%360)+360)%360,target=k*36;
      const delta=dir>0?(target-cur+360)%360:-((cur-target+360)%360);
      const total=delta+dir*turns*360,start=A,dur=1200+turns*380;
      if(matchMedia('(prefers-reduced-motion: reduce)').matches){setA(start+total);land(k);return}
      const t0=performance.now();
      const tick=now=>{const t=Math.min(1,(now-t0)/dur);setA(start+total*(1-Math.pow(1-t,4)));if(t<1)requestAnimationFrame(tick);else land(k)};
      requestAnimationFrame(tick);
    };
    reel.addEventListener('pointerdown',e=>{if(state!=='idle')return;e.preventDefault();try{reel.setPointerCapture(e.pointerId)}catch(_){}drag={y:e.clientY,a:A,samples:[{t:performance.now(),a:A}]};state='drag'});
    reel.addEventListener('pointermove',e=>{if(state!=='drag')return;setA(drag.a-(e.clientY-drag.y)*36/H);const t=performance.now();drag.samples.push({t,a:A});drag.samples=drag.samples.filter(s=>t-s.t<120)});
    const up=()=>{if(state!=='drag')return;const s=drag.samples,f=s[0],l=s[s.length-1];const moved=A-drag.a;
      let vel=s.length>1?(l.a-f.a)/Math.max(16,l.t-f.t):0;
      if(Math.abs(moved)<6)vel=.7+rnd(9)/10;else if(Math.abs(vel)<.3)vel=.3*Math.sign(moved);
      spin(vel)};
    reel.addEventListener('pointerup',up);reel.addEventListener('pointercancel',up);
    v.querySelector('#fspin').onclick=()=>{if(state==='idle')spin(.7+rnd(12)/10)};
    v.querySelector('#fx').onclick=()=>{if(state!=='idle')return;close(null)};
  });
}

  // Zaino
  h+=`<section class="sec"><h2>Zaino<span class="cnt">${c.hasBackpack?c.backpack.length+' su 8':'perso'}</span></h2>`;
  if(!c.hasBackpack)h+=`<p class="lead">Hai perso lo Zaino e il suo contenuto.</p><button class="btn" data-a="regain-pack">Hai trovato uno Zaino</button>`;
  else{
    h+=`<ul class="ledger">${Array.from({length:8},(_,i)=>{const it=c.backpack[i];if(!it)return `<li><span class="n">${i+1}</span><span class="t"><span class="empty">libero</span></span></li>`;
      const desc=it.kind==='pasto'?'Pasto':it.kind==='cura'?`Pozione curativa, +${it.v} RESISTENZA`:it.kind==='alether'?`Pozione di Alether, +${it.v} COMBATTIVITÀ in combattimento`:'';
      return `<li><span class="n">${i+1}</span><span class="t">${esc(it.name)}${desc&&desc!==it.name?`<small>${desc}</small>`:''}</span><span class="acts">${it.kind==='cura'?`<button class="btn sm" data-a="drink" data-id="${it.id}" ${busy?'disabled':''}>Bevi</button>`:''}${depositOpen(c)&&c.phase==='prep'?`<button class="btn sm" data-a="dep" data-src="pack" data-id="${it.id}">Deposita</button>`:''}<button class="x" data-a="del-pack" data-id="${it.id}" aria-label="Elimina ${esc(it.name)}" ${busy?'disabled':''}>×</button></span></li>`}).join('')}</ul>`;
    if(c.backpack.length<8&&!busy)h+=`<div class="grid3"><label class="f"><span>Oggetto</span><input id="pname" placeholder="es. Corda"></label><label class="f"><span>Tipo</span><select id="pkind" data-f="pkind"><option value="altro">Oggetto</option><option value="pasto">Pasto</option><option value="cura">Pozione curativa</option><option value="alether">Alether</option></select></label><label class="f"><span id="pvl">Nessun valore</span><input id="pval" type="number" inputmode="numeric" disabled></label></div>
    <div class="row"><button class="btn pri" data-a="add-pack">Metti nello Zaino</button><button class="btn" data-a="add-meal">+1 Pasto</button></div>`;
    h+=`<p class="note">Pasti nello Zaino: ${meals(c)}. Senza cibo, quando devi mangiare perdi 3 RESISTENZA. Per le pozioni indica i punti: RESISTENZA recuperata per quelle curative, COMBATTIVITÀ in più per l’Alether.</p>
    <div class="row"><button class="btn sm dng" data-a="lose-pack" ${busy?'disabled':''}>Il testo ti fa perdere lo Zaino</button></div>`;
  }
  h+=`</section>`;
  // Borsa
  h+=`<section class="sec"><h2>Borsa<span class="cnt">massimo 50 monete</span></h2><div class="row">${step('gold',c.gold)}<select id="curr" data-f="currency" style="width:auto;flex:1">${Object.keys(CURR).map(k=>`<option ${c.currency===k?'selected':''}>${k}</option>`).join('')}</select></div>
  <div class="row"><button class="btn sm" data-a="gold5" data-d="-5">−5</button><button class="btn sm" data-a="gold5" data-d="5">+5</button><button class="btn sm" data-a="gold5" data-d="10">+10</button>${c.currency!=='Corone d’oro'?`<button class="btn sm" data-a="convert">Converti in Corone d’oro (1 Corona = ${CURR[c.currency]} ${esc(c.currency)})</button>`:''}</div></section>`;
  // Speciali
  h+=`<section class="sec"><h2>Oggetti Speciali<span class="cnt">${c.specials.length}${lim<99?' su '+lim:''}</span></h2><p class="lead">Non vanno nello Zaino. Le armi speciali non contano nel limite delle 2 armi. Tocca un’armatura, un elmo o uno scudo per indossarlo o toglierlo.</p>
  <ul class="ledger">${c.specials.map((s,i)=>`<li><span class="n">${i+1}</span><span class="t">${esc(s.name)}<small>${specialDesc(c,s)}</small></span><span class="acts">${s.kind==='faretra'?step('arrows',s.arrows,`data-id="${s.id}"`):''}${['armatura','elmo','scudo','altro'].includes(s.kind)?chip('toggle-eq',s.eq?'Indossato':'Riposto',s.eq,`data-id="${s.id}" ${busy?'disabled':''}`):''}${depositOpen(c)&&c.phase==='prep'?`<button class="btn sm" data-a="dep" data-src="spec" data-id="${s.id}">Deposita</button>`:''}<button class="x" data-a="del-special" data-id="${s.id}" aria-label="Elimina ${esc(s.name)}" ${busy?'disabled':''}>×</button></span></li>`).join('')||'<li><span class="t"><span class="empty">Nessun Oggetto Speciale</span></span></li>'}</ul>
  <div class="row"><button class="btn pri" data-a="special-sheet" ${busy||c.specials.length>=lim?'disabled':''}>Aggiungi Oggetto Speciale</button>${c.specials.some(s=>s.sun)?'':`<button class="btn" data-a="sun-sword" ${busy||c.specials.length>=lim?'disabled':''}>Spada del Sole</button>`}</div></section>`;
  // Tiro
  const bow=c.weapons.some(w=>w.type==='Arco');const arrows=sum(c.specials.filter(s=>s.kind==='faretra'),s=>s.arrows);
  if(bow||c.specials.some(s=>s.kind==='faretra')||rsN(c)>=7)h+=`<section class="sec"><h2>Armi a distanza</h2><p class="lead">Usale solo quando il testo lo consente. Il numero estratto riceve i bonus delle Arti.</p>
  <div class="row"><button class="btn pri" data-a="shoot" data-k="arco" ${bow&&arrows>0?'':'disabled'}>Tira con l’Arco (${arrows} Frecce)</button><button class="btn" data-a="shoot" data-k="lancio">Arma da lancio</button></div>
  ${bow&&!c.specials.some(s=>s.kind==='faretra')?'<p class="note">Per usare l’Arco ti servono una Faretra e almeno una Freccia.</p>':''}</section>`;

  if(c.book>=5){const open=depositOpen(c);

    <ul class="ledger">${c.deposit.map(d=>`<li><span class="t">${esc(d.item.name)}<small>${d.src==='pack'?'Oggetto dello Zaino':d.src==='arm'?'Arma':'Oggetto Speciale'}</small></span>${open&&c.phase==='prep'?`<span class="acts"><button class="btn sm" data-a="withdraw" data-id="${d.item.id}">Ritira</button></span>`:''}</li>`).join('')||'<li><span class="t"><span class="empty">Vuoto</span></span></li>'}</ul></section>`;}
  return h;
}
function specialDesc(c,s){
  const b=[];if(s.kind==='arma'){b.push(s.sun?'Arma unica, conta come Spada, Daga o Spadone':'Arma speciale, '+(s.wtype||'Altro'));const m=mastery(c,{type:s.wtype,sun:s.sun});if(m)b.push(m[0]+' '+sgn(m[1]))}
  else if(s.kind==='armatura')b.push(s.atype||'Armatura');else if(s.kind==='faretra')b.push('Faretra, massimo 6 Frecce');else b.push(SPECIAL_KINDS[s.kind]);
  if(s.comb)b.push(sgn(s.comb)+' COMBATTIVITÀ');if(s.res)b.push(sgn(s.res)+' RESISTENZA');if(s.sun)b.push('danni doppi ai non-morti');if(s.note)b.push(esc(s.note));
  return b.join(', ');
}

/* --- Combattimento --- */
function renderComb(c){
  const cb=c.combat;
  if(!cb){
    return `<section class="sec"><h2>Nuovo combattimento</h2><p class="lead">Inserisci il nemico come indicato nel paragrafo. Puoi aggiungerne altri in coda.</p>${foeForm()}
    <div class="row"><button class="btn pri big wide" data-a="foe-add" ${c.phase==='prep'?'disabled':''}>Inizia il combattimento</button></div>${c.phase==='prep'?'<p class="note">Prima inserisci il paragrafo di partenza nel Diario.</p>':''}</section>
    ${c.postCombat&&c.backpack.some(i=>i.kind==='cura')?`<div class="banner">Combattimento concluso: se vuoi, ora puoi bere una pozione curativa dallo Zaino.</div>`:''}
    <section class="sec"><h2>Diario di combattimento</h2>${c.log.length?`<ul class="ledger">${c.log.slice().reverse().slice(0,15).map(l=>`<li><span class="t">${esc(l.foes)}<small>Paragrafo ${l.para??'—'}, ${l.rounds} scontri, ${esc(l.out)}</small></span></li>`).join('')}</ul>`:'<p class="lead">Nessun combattimento ancora.</p>'}</section>`;
  }
  const e=cb.enemies[cb.idx];const cc=combatComb(c,cb,e);const ratio=cc.total-e.comb;const p=psiInfo(c);
  const allW=allWeapons(c).filter(w=>w.type!=='Arco');
  let h=`<section class="sec"><h2>${esc(e.name)}<span class="cnt">${cb.enemies.length>1?`nemico ${cb.idx+1} di ${cb.enemies.length}`:`paragrafo ${c.para?c.para.n:'—'}`}</span></h2>
  <div class="vs"><div class="side"><div class="l">Lupo Solitario</div><div class="v">${cc.total}</div></div><div class="ratio">Rapporto di Forza<b>${sgn(ratio)}</b></div><div class="side"><div class="l">${esc(e.name)}</div><div class="v">${e.comb}</div></div></div>
  <div class="resbars"><div><div class="note">Tua RESISTENZA: <b>${c.resCur}</b></div><div class="bar ${c.resCur<=6?'low':''}"><i style="width:${Math.min(100,c.resCur/maxRes(c)*100)}%"></i></div></div>
  <div><div class="note">Nemico: <b>${e.res}</b> / ${e.res0}</div><div class="bar low"><i style="width:${Math.min(100,e.res/e.res0*100)}%"></i></div></div></div>
  <div class="row"><button class="btn pri big wide" data-a="round">${cb.rounds.length?'Nuovo scontro':'Primo scontro'}</button></div>
  <div class="row">${e.flee&&e.roundsHere>0?`<button class="btn" data-a="flee">Fuggi (scontro di fuga)</button>`:''}${arciMedReady(c,true)?`<button class="btn pri" data-a="arci-med">Medicina da Arcimaestro: +20</button>`:''}<button class="btn sm" data-a="end-combat">Il testo interrompe il combattimento</button></div>
  ${UI.lastRound?`<p class="note" aria-live="polite">${UI.lastRound}</p>`:''}</section>`;
  // Impostazioni dello scontro
  const locked=cb.rounds.length>0;
  h+=`<section class="sec"><h2>Modificatori</h2>
  <p class="note">Arma${locked?' (non puoi cambiarla durante il combattimento)':''}</p><div class="chips">${chip('cb-weapon','Senza armi',!cb.weapon,`data-id="" ${locked?'disabled':''}`)}${allW.map(w=>chip('cb-weapon',esc(w.name),cb.weapon===w.id,`data-id="${w.id}" ${locked?'disabled':''}`)).join('')}</div>
  ${p.laser||p.raggio?`<p class="note">Attacco psichico${e.immune?': il nemico è immune':''}</p><div class="chips">${chip('cb-psi','Nessuno',cb.psi==='none','data-v="none"')}${p.laser?chip('cb-psi','Psicolaser '+sgn(p.laserV),cb.psi==='laser',`data-v="laser" ${e.immune?'disabled':''}`):''}${p.raggio?chip('cb-psi',`Raggio Psichico ${sgn(p.raggioV)}, −${p.cost} RES a scontro`,cb.psi==='raggio',`data-v="raggio" ${e.immune||c.resCur<=p.min?'disabled':''}`):''}</div>`:''}
  ${!locked?alForm(c,cb):cb.alether?`<p class="note">Pozione di Alether bevuta: +${cb.alether}.</p>`:''}
  <div class="row"><span style="flex:1">Modificatore dal testo</span>${step('cb-mod',sgn(cb.mod))}</div>
  <div class="row"><span style="flex:1">Sorpresa o imboscata${hasR(c,'fiuto')?' (Fiuto la annulla)':''}</span>${step('cb-amb',sgn(cb.ambush))}</div>
  <ul class="brk">${cc.parts.map(([l,v])=>`<li><span>${esc(l)}</span><span>${sgn(v)}</span></li>`).join('')}<li><span><b>Totale</b></span><span><b>${cc.total}</b></span></li></ul>
  <p class="note">${[e.immune?'Immune agli attacchi psichici':'',e.undead?'Non-morto'+(cc.w&&cc.w.sun?': danni raddoppiati dalla Spada del Sole':''):'',e.mind?`Attacco mentale: −${e.mind} RES a scontro${mindShield(c)?' (annullato dalla tua difesa psichica)':''}`:'',e.flee?'Fuga consentita dal testo':''].filter(Boolean).join('. ')}</p></section>`;
  if(cb.rounds.length)h+=`<section class="sec"><h2>Scontri</h2><ul class="log">${cb.rounds.slice().reverse().map(r=>`<li><span class="d">${r.d}</span><span>${esc(r.foe)}: ${r.eL==='K'?'<span class="k">ucciso</span>':'−'+r.eL}. Lupo Solitario: ${r.lL==='K'?'<span class="k">ucciso</span>':'−'+r.lL}${r.extra?` (di cui ${r.extra} per ${esc(r.why)})`:''}. Rapporto ${sgn(r.ratio)}.${r.flee?' Fuga.':''}</span></li>`).join('')}</ul></section>`;
  if(cb.enemies.length>1||true)h+=`<section class="sec"><h2>Nemici</h2>${cb.enemies.map((x,i)=>`<div class="foe ${i===cb.idx?'cur':''}"><span class="t"><b>${esc(x.name)}</b><br><small class="note">COMBATTIVITÀ ${x.comb}, RESISTENZA ${x.res}/${x.res0}${x.res<=0?', sconfitto':''}</small></span></div>`).join('')}
  <details><summary class="note" style="padding:10px 0">Aggiungi un nemico in coda</summary>${foeForm()}<button class="btn" data-a="foe-queue">Aggiungi in coda</button></details></section>`;
  return h;
}
function foeForm(){return `<label class="f"><span>Nome</span><input id="fname" placeholder="es. Giak"></label>
  <div class="grid2"><label class="f"><span>Combattività</span><input id="fcomb" type="number" inputmode="numeric"></label><label class="f"><span>Resistenza</span><input id="fres" type="number" inputmode="numeric"></label></div>
  <div class="chips"><label class="chip"><input type="checkbox" id="fimm"> Immune agli attacchi psichici</label><label class="chip"><input type="checkbox" id="fund"> Non-morto</label><label class="chip"><input type="checkbox" id="fflee"> Fuga consentita</label></div>
  <label class="f"><span>Attacco mentale del nemico (RESISTENZA persa a ogni scontro, 0 se assente)</span><input id="fmind" type="number" inputmode="numeric" value="0"></label>`}
function alForm(c,cb){const al=c.backpack.filter(i=>i.kind==='alether');if(!al.length)return '';
  return `<div class="row"><span style="flex:1">Pozione di Alether (da bere prima del primo scontro)</span>${al.map(i=>`<button class="btn sm" data-a="cb-alether" data-id="${i.id}" ${cb.alether?'disabled':''}>Bevi ${esc(i.name)} +${i.v}</button>`).join('')}</div>`}

/* --- Diario --- */
function renderDiario(c){

  <div class="row" style="margin-top:18px"><button class="btn dng" data-a="reset-app">Reimposta l’app</button></div><p class="note">Elimina tutti i personaggi, il diario, le mappe e le impostazioni, e riporta l’app alla schermata iniziale.</p></section>`;
}

/* --- Creazione --- */
function newCR(){return {name:'Lupo Solitario',book:1,comb:'',res:'',ramas:[],scherma:'',ramastan:[],guerra:[],gold:''}}
function reqRamas(b){return b<=5?4+b:10}
function reqRamastan(b){return b>=6?b-3:0}
function reqGuerra(b){return 3+Math.max(0,b-6)}
function crOk(){const r=UI.create,b=r.book,rs=b>=6;
  const needSch=(rs||r.ramas.includes('scherma'));const needG=rs&&r.ramastan.includes('guerra');
  return !!(r.name.trim()&&String(r.comb).trim()!==''&&String(r.res).trim()!==''&&(rs||r.ramas.length===reqRamas(b))&&(!rs||r.ramastan.length===reqRamastan(b))&&(!needSch||r.scherma)&&(!needG||r.guerra.length===reqGuerra(b)));}
function crBtn(){const b=document.querySelector('[data-a="cr-done"]');if(b)b.disabled=!crOk()}
function renderCreate(){
  const r=UI.create,b=r.book,rs=b>=6;
  const needSch=(rs||r.ramas.includes('scherma'));const needG=rs&&r.ramastan.includes('guerra');const ok=crOk();
  let h=`<div class="full"><div class="in"><h1>Nuovo personaggio</h1><p class="lead">Segui la procedura del libro. Puoi anche trascrivere un personaggio già in gioco su carta.</p>
  <label class="f"><span>Nome</span><input id="cr-name" data-f="cr-name" value="${esc(r.name)}"></label>
  <p class="note">Libro di partenza</p><div class="chips">${Object.keys(BOOKS).map(k=>chip('cr-book',k,+k===b,`data-v="${k}"`)).join('')}</div><p class="note"><i>${BOOKS[b]}</i>, ciclo ${rs?'Ramastan':'Ramas'}</p>
  <section class="sec"><h2>Combattività e Resistenza</h2><p class="lead">Combattività: 10 + numero estratto. Resistenza: 20 + numero estratto. Valori base, senza Cerchi né oggetti.</p>
  <div class="grid2"><label class="f"><span>Combattività</span><input type="number" inputmode="numeric" data-f="cr-comb" value="${esc(r.comb)}"></label><label class="f"><span>Resistenza</span><input type="number" inputmode="numeric" data-f="cr-res" value="${esc(r.res)}"></label></div>
  <div class="row"><button class="btn" data-a="cr-draw" data-k="comb">Estrai la Combattività</button><button class="btn" data-a="cr-draw" data-k="res">Estrai la Resistenza</button></div></section>`;
  if(rs)h+=`<section class="sec"><h2>Arti Ramas</h2><p class="lead">Come Maestro Ramas possiedi tutte e dieci le Arti Ramas.</p></section>`;

function logNotes(c){
  migrate(c);
  const lines=t=>(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const pool=new Map();lines(c.notesLogged).forEach(l=>pool.set(l,(pool.get(l)||0)+1));
  const fresh=[];for(const l of lines(c.notes)){const n=pool.get(l)||0;if(n>0)pool.set(l,n-1);else fresh.push(l)}
  c.notesLogged=c.notes||'';
  if(fresh.length)c.journal.push({k:'n',txt:fresh.join('\n'),p:c.para?c.para.n:null,t:Date.now()});
  return fresh.length>0;
}
function journalTail(j){
  // ultime voci, partendo da un punto leggibile: almeno 12 paragrafi o 6 eventi
  let i=j.length,ev=0,pp=0;while(i>0&&ev<6&&pp<14){i--;if(j[i].k==='p')pp++;else ev++}
  return j.slice(i);
}
function journalHtml(list){
  if(!list.length)return '<p class="lead">Il diario si riempie mentre giochi: paragrafi, combattimenti e note.</p>';
  let h='',run=[];
  const flush=()=>{if(run.length){h+=`<p class="jpath">§ ${run.join('<i>›</i>')}</p>`;run=[]}};
  const OUT={vittoria:'Vittoria',fuga:'Fuga',morte:'Sconfitta',interrotto:'Combattimento interrotto dal testo'};
  for(const e of list){
    if(e.k==='p'){run.push(esc(e.n));continue}
    flush();
    if(e.k==='b')h+=`<h4 class="jbook">Libro ${e.book}<small>${BOOKS[e.book]||''}</small></h4>`;
    else if(e.k==='e')h+=`<p class="jev">${esc(e.txt)}</p>`;
    else if(e.k==='n')h+=`<blockquote class="jnote">${esc(e.txt).replace(/\n/g,'<br>')}${e.p?`<small>Paragrafo ${e.p}</small>`:''}</blockquote>`;
    else if(e.k==='c'){
      const nm=i=>esc((e.f[i]||e.f[0]||['Nemico'])[0]);
      const rounds=e.r.map(r=>`<li>Numero ${r[0]}, rapporto ${sgn(r[1])}: ${nm(r[4])} ${r[2]==='K'?'ucciso':r[2]?'−'+r[2]:'illeso'}, Lupo Solitario ${r[3]==='K'?'ucciso':r[3]?'−'+r[3]:'illeso'}${r[5]?' (fuga)':''}</li>`).join('');
      h+=`<div class="jcomb">Combattimento con ${e.f.map(f=>`<b>${esc(f[0])}</b> (COMB ${f[1]}, RES ${f[2]})`).join(', ')}${e.p?`<small>Paragrafo ${e.p}</small>`:''}<ol>${rounds}</ol><p class="o">${OUT[e.o]||esc(e.o)} in ${e.r.length} ${e.r.length===1?'scontro':'scontri'}, RESISTENZA ${e.res}.</p></div>`;
    }
  }
  flush();return h;
}

  const c=C();if(!c)return;logNotes(c);

const IDB={p:null,
  open(){if(!this.p)this.p=Promise.race([new Promise((res,rej)=>{try{const r=indexedDB.open('registro-di-guerra',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('archivio locale non disponibile')),3000))]);this.p.catch(()=>{this.p=null});return this.p},
  async run(mode,fn){const d=await this.open();return new Promise((res,rej)=>{const tx=d.transaction('files',mode);const st=tx.objectStore('files');const rq=fn(st);tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error)})},
  get(k){return this.run('readonly',s=>s.get(k))},set(k,v){return this.run('readwrite',s=>s.put(v,k))},del(k){return this.run('readwrite',s=>s.delete(k))},keys(){return this.run('readonly',s=>s.getAllKeys())}};
const AON={1:'01fftd',2:'02fotw',3:'03tcok',4:'04tcod',5:'05sots',6:'06tkot',7:'07cd',8:'08tjoh',9:'09tcof',10:'10tdot',11:'11tpot',12:'12tmod'};
const MAPURL={};
const MAP_ALIAS={2:1}; // Traversata Infernale usa la stessa mappa de I Signori delle Tenebre
const blobToData=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function mapRaw(n){try{const v=await IDB.get('map-'+n);if(!v)return null;if(typeof v==='string')return v;const d=await blobToData(v);try{await IDB.set('map-'+n,d)}catch(e){}return d}catch(e){return null}}
async function mapBlob(n){return (await mapRaw(n))||(MAP_ALIAS[n]?await mapRaw(MAP_ALIAS[n]):null)}
let ASSETS;
async function getAssets(){if(ASSETS!==undefined)return ASSETS;if(!window.claude||typeof window.claude.use!=='function'){ASSETS=null;return null}try{ASSETS=await window.claude.use('assets')}catch(e){ASSETS=null}return ASSETS}
const mapsCloud=()=>S().maps||{};
function mapAssetId(n){const m=mapsCloud();return m[n]||(MAP_ALIAS[n]?m[MAP_ALIAS[n]]:null)||null}
function dataToBlob(d){const i=d.indexOf(',');const mime=(d.slice(0,i).match(/data:([^;]+)/)||[,'image/jpeg'])[1];const bin=atob(d.slice(i+1));const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:mime})}
async function mapUrl(n){const id=mapAssetId(n);if(id)return '/_blob/'+id;if(MAPURL[n])return MAPURL[n];const d=await mapBlob(n);if(d)MAPURL[n]=d;return d}
function shrinkImage(f){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(r.error);r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('immagine non leggibile'));im.onload=()=>{
  const max=3200,k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
  if(k===1&&f.size<4e6){res(r.result);return}
  const cv=document.createElement('canvas');cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.88))};im.src=r.result};r.readAsDataURL(f)})}

  const rows=[];
  for(let n=1;n<=12;n++){

  }
  L.innerHTML=`<div class="full" role="dialog" aria-modal="true" aria-label="Mappe"><div class="in"><div class="row"><h1 style="flex:1;margin:0">Mappe</h1><button class="btn" data-a="layer-close">Chiudi</button></div>
  <p class="lead">Carica le mappe che hai scaricato o fotografato: ${as?'restano nello spazio privato di questa app sul tuo account Claude, quindi le ritrovi anche dal Mac':'restano salvate solo su questo dispositivo'}. Per i libri senza mappa trovi il link alla versione inglese di Project Aon.</p>
  <ul class="ledger maps">${rows.join('')}</ul><div class="row"><button class="btn wide" data-a="layer-close">Chiudi</button></div></div></div>`;

function pickMap(n){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    if(f.size>25e6){toast('Immagine troppo grande (massimo 25 MB)');return}
    toast('Salvataggio della mappa…');
    try{const d=await shrinkImage(f);const as=await getAssets();
      if(as){const r=await as.upload(dataToBlob(d));const m={...mapsCloud()};const old=m[n];m[n]=r.id;APP.settings.maps=m;APP.settingsUpdated=Date.now();CLOUD.settingsDirty=true;persist(null);if(old){try{await as.delete(old)}catch(e){}}}
      else await IDB.set('map-'+n,d);
      Object.keys(MAPURL).forEach(k=>delete MAPURL[k]);toast('Mappa del libro '+n+' salvata');openMaps()}catch(e){toast('Non riesco a salvare l’immagine: '+(e&&(e.message||e.code)||'errore sconosciuto'))}};
  inp.click();
}
async function viewMap(n){
  const u=await mapUrl(n);if(!u){openMaps();return}
  const v=document.createElement('div');v.className='mv';v.setAttribute('role','dialog');v.setAttribute('aria-label','Mappa del libro '+n);
  v.innerHTML=`<img alt="Mappa del libro ${n}" draggable="false"><div class="mvbar"><span>${esc(BOOKS[n])}</span><button class="btn sm" data-z="-1" aria-label="Riduci">−</button><button class="btn sm" data-z="1" aria-label="Ingrandisci">+</button><button class="btn sm pri" data-z="x">Chiudi</button></div>`;
  document.body.appendChild(v);const img=v.querySelector('img');
  let s=1,x=0,y=0,fit=1;const P=new Map();let g=null,lastTap=0;
  const W=()=>v.clientWidth,H=()=>v.clientHeight;
  const clamp=()=>{const iw=img.naturalWidth*s,ih=img.naturalHeight*s;
    x=iw<=W()?(W()-iw)/2:Math.min(0,Math.max(W()-iw,x));y=ih<=H()?(H()-ih)/2:Math.min(0,Math.max(H()-ih,y));
    img.style.transform=`translate(${x}px,${y}px) scale(${s})`};
  const zoomAt=(ns,cx,cy)=>{ns=Math.max(fit,Math.min(fit*6,ns));const px=(cx-x)/s,py=(cy-y)/s;s=ns;x=cx-px*s;y=cy-py*s;clamp()};
  img.onload=()=>{fit=Math.min(W()/img.naturalWidth,H()/img.naturalHeight);s=fit;clamp()};img.src=u;
  v.addEventListener('pointerdown',e=>{if(e.target.closest('.mvbar'))return;v.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const pts=[...P.values()];
    if(pts.length===2){const[a,b]=pts;g={d:Math.hypot(a.x-b.x,a.y-b.y),s,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,x,y}}
    else if(pts.length===1){g={px:e.clientX,py:e.clientY,x,y};const t=Date.now();if(t-lastTap<300){zoomAt(s>fit*1.5?fit:fit*2.5,e.clientX,e.clientY);g=null}lastTap=t}});
  v.addEventListener('pointermove',e=>{if(!P.has(e.pointerId)||!g)return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});const pts=[...P.values()];
    if(pts.length>=2&&g.d){const[a,b]=pts;const d=Math.hypot(a.x-b.x,a.y-b.y);const ns=Math.max(fit,Math.min(fit*6,g.s*d/g.d));const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      const px=(g.mx-g.x)/g.s,py=(g.my-g.y)/g.s;s=ns;x=mx-px*s;y=my-py*s;clamp()}
    else if(pts.length===1&&g.px!==undefined){x=g.x+(e.clientX-g.px);y=g.y+(e.clientY-g.py);clamp()}});
  const up=e=>{P.delete(e.pointerId);const pts=[...P.values()];g=pts.length===1?{px:pts[0].x,py:pts[0].y,x,y}:null};
  v.addEventListener('pointerup',up);v.addEventListener('pointercancel',up);
  v.querySelector('.mvbar').addEventListener('click',e=>{const b=e.target.closest('[data-z]');if(!b)return;if(b.dataset.z==='x'){v.remove();return}zoomAt(s*(b.dataset.z==='1'?1.6:1/1.6),W()/2,H()/2)});
  addEventListener('resize',()=>{if(!document.body.contains(v))return;fit=Math.min(W()/img.naturalWidth,H()/img.naturalHeight);if(s<fit)s=fit;clamp()});
}

function rulesHtml(){
  const sec=(id,t,body)=>`<section class="rsec" id="${id}"><h2>${t}</h2>${body}<p class="rtop"><button class="btn sm" data-a="rules-top">Torna all’indice</button></p></section>`;
  const lst=a=>`<ul class="rl2">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  const S1=[
  ['r-pg','Il personaggio',`<p>Lupo Solitario ha due caratteristiche. La <b>COMBATTIVITÀ</b> misura l’abilità nel combattimento ed è 10 più un numero estratto. La <b>RESISTENZA</b> misura salute e forza vitale ed è 20 più un numero estratto.</p>
   <p>La RESISTENZA sale e scende durante l’avventura ma non supera mai il valore massimo, che cresce solo con armature, elmi, Cerchi di Sapienza o quando il testo lo dice. Se arriva a zero, Lupo Solitario muore e l’avventura finisce: si ricomincia il libro dall’inizio.</p>`],
  ['r-tdd','La Tabella del Destino',`<p>Serve a introdurre il caso: in combattimento, nella creazione del personaggio e ogni volta che il testo chiede di estrarre un numero. I numeri vanno da 0 a 9 e lo 0 vale zero. Il manuale ammette anche un dado a dieci facce. In questa app l’estrazione avviene con il rullo, con la stessa probabilità di 1 su 10 per ogni cifra.</p>`],
  ['r-comb','Il combattimento',`<p>Un <b>combattimento</b> è l’intera battaglia contro un avversario; uno <b>scontro</b> è un singolo round, cioè ogni estrazione di un numero.</p>
   <ol class="rl2"><li>Somma alla COMBATTIVITÀ di base i bonus di Arti, Oggetti Speciali equipaggiati ed eventuale pozione di Alether.</li><li>Sottrai la COMBATTIVITÀ del nemico: ottieni il <b>Rapporto di Forza</b>.</li><li>Estrai un numero.</li><li>Incrocia Rapporto di Forza e numero nella Tabella dei Risultati: leggi i punti di RESISTENZA persi dal nemico e da Lupo Solitario.</li><li>Aggiorna le RESISTENZE e, se nessuno è a zero e il testo non dice altro, passa allo scontro successivo.</li></ol>
   <p>Chi arriva a zero muore. Se vince Lupo Solitario, prosegue con la RESISTENZA ridotta e la recupererà più avanti. L’app usa la tabella estesa, con rapporti da −30 a +30: oltre quei valori vale la colonna estrema, e il teschio indica la morte immediata.</p>
   <p><b>Senza armi</b> perdi 4 punti di COMBATTIVITÀ (meno con i perfezionamenti della Guerra). L’Arco non è un’arma da mischia: combattere solo con l’Arco equivale a combattere disarmati.</p>

function snapshotBook(c){const o=JSON.parse(JSON.stringify(c));delete o.bookStart;delete o.journal;c.bookStart=JSON.stringify(o)}
function startCombat(c,foe){c.combat={enemies:[foe],idx:0,rounds:[],weapon:bestWeapon(c),psi:psiInfo(c).laser&&!foe.immune?'laser':'none',alether:0,mod:0,ambush:0};UI.lastRound=null}
function readFoe(){
  const name=document.getElementById('fname').value.trim()||'Nemico';const comb=num(document.getElementById('fcomb').value,NaN),res=num(document.getElementById('fres').value,NaN);
  if(!Number.isFinite(comb)||!Number.isFinite(res)||res<=0){toast('Inserisci Combattività e Resistenza del nemico');return null}
  return {id:uid(),name,comb,res,res0:res,immune:document.getElementById('fimm').checked,undead:document.getElementById('fund').checked,flee:document.getElementById('fflee').checked,mind:Math.max(0,num(document.getElementById('fmind').value)),roundsHere:0};
}
function endCombat(c,out){
  const cb=c.combat;c.log.push({para:c.para?c.para.n:null,foes:cb.enemies.map(e=>e.name).join(', '),rounds:cb.rounds.length,out,t:Date.now()});
  if(c.journal)c.journal.push({k:'c',p:c.para?c.para.n:null,f:cb.enemies.map(e=>[e.name,e.comb,e.res0,e.res]),r:cb.rounds.map(r=>[r.d,r.ratio,r.eL,r.lL,r.fi??Math.max(0,cb.enemies.findIndex(e=>e.name===r.foe)),r.flee?1:0]),o:out,res:Math.max(0,c.resCur),t:Date.now()});
  c.combat=null;c.postCombat=out==='vittoria';
}
/* Risoluzione di uno scontro: calcolata identica per l'anteprima nel rullo e per l'applicazione */
function computeRound(c,d,flee){
  const cb=c.combat,e=cb.enemies[cb.idx],p=psiInfo(c);let psi=cb.psi,switched=false;
  if(psi==='raggio'&&c.resCur<=p.min){psi=p.laser?'laser':'none';switched=true}
  const cc=combatComb(c,{...cb,psi},e);const ratio=cc.total-e.comb;const r=crt(ratio,d);
  let eL=r.n==='K'?'K':-r.n;const sun=!!(cc.w&&cc.w.sun&&e.undead);if(eL!=='K'&&sun)eL*=2;if(flee)eL=0;
  const lL=r.l==='K'?'K':-r.l;let extra=0;const why=[];
  if(!e.immune&&psi==='raggio'&&p.raggio){extra+=p.cost;why.push('Raggio Psichico')}
  if(e.mind&&!mindShield(c)){extra+=e.mind;why.push('attacco mentale')}
  const dmg=(lL==='K'?c.resCur:lL)+extra;
  const eAfter=eL==='K'?0:Math.max(0,e.res-eL),lAfter=Math.max(0,c.resCur-dmg);
  const nextFoe=cb.enemies.find((x,i)=>i!==cb.idx&&x.res>0);
  const end=lAfter<=0?'morte':flee?'fuga':eAfter<=0?(nextFoe?'next':'vittoria'):null;
  return {d,ratio,total:cc.total,eL,lL,extra,why:why.join(' e '),dmg,eAfter,lAfter,psi,switched,e,sun,end,nextFoe};
}
function roundHtml(R){
  const me=R.lL==='K'?'ucciso':R.dmg?`−${R.dmg} RES`:'nessun danno';
  const foe=R.eL==='K'?'ucciso':R.eL?`−${R.eL} RES`:'nessun danno';
  const end={morte:'Lupo Solitario cade.',fuga:'Sei fuggito.',vittoria:esc(R.e.name)+' è sconfitto.',next:R.nextFoe?esc(R.e.name)+' è sconfitto: ora affronti '+esc(R.nextFoe.name)+'.':''}[R.end]||'';
  const notes=[R.extra?`Di cui ${R.extra} per ${R.why}.`:'',R.sun&&R.eL&&R.eL!=='K'?'Danni raddoppiati dalla Spada del Sole.':'',R.switched?'RESISTENZA troppo bassa per il Raggio Psichico: usi lo Psicolaser.':''].filter(Boolean).join(' ');
  return `<div class="rres"><div class="rl me"><span class="who">Lupo Solitario</span><b class="${R.dmg?'':'zero'}">${me}</b><small>resta ${R.lAfter}</small></div>
  <div class="rl foe"><span class="who">${esc(R.e.name)}</span><b class="${R.eL?'':'zero'}">${foe}</b><small>resta ${R.eAfter}</small></div></div>
  ${notes?`<p class="note">${notes}</p>`:''}${end?`<p class="rend">${end}</p>`:''}`;
}
async function doRound(flee){
  const c=C();if(!c||!c.combat)return;const e0=c.combat.enemies[c.combat.idx];
  const P=computeRound(c,0,flee);
  const r=await drawReel(flee?'Scontro di fuga':'Scontro con '+e0.name,null,{
    pre:`Rapporto di Forza <b>${sgn(P.ratio)}</b>: ${P.total} contro ${e0.comb}.${flee?' Nella fuga il nemico non subisce danni.':''}`,
    describe:k=>roundHtml(computeRound(C(),k,flee)),
    canAgain:k=>{const R=computeRound(C(),k,flee);return !R.end||R.end==='next'}});
  if(!r)return;
  mutate(c=>{
    const cb=c.combat,e=cb.enemies[cb.idx],R=computeRound(c,r.d,flee);
    if(R.switched){cb.psi=R.psi;toast('RESISTENZA troppo bassa per il Raggio Psichico: passi allo Psicolaser')}
    e.res=R.eAfter;c.resCur-=R.dmg;if(c.para){c.para.fought=true;if(R.dmg>0)c.para.lost=true}
    e.roundsHere++;cb.rounds.push({d:r.d,ratio:R.ratio,eL:R.eL,lL:R.lL==='K'?'K':R.lL+R.extra,extra:R.extra,why:R.why,foe:e.name,fi:cb.idx,flee});
    UI.lastRound=`Numero ${r.d}, Rapporto ${sgn(R.ratio)}: ${e.name} ${R.eL==='K'?'ucciso':'−'+R.eL}, tu ${R.lL==='K'?'ucciso':'−'+(R.lL+R.extra)}.`;
    if(c.resCur<=0){c.resCur=0;endCombat(c,'morte');return}
    if(flee){endCombat(c,'fuga');toast('Sei fuggito');return}
    if(e.res<=0){
      const next=cb.enemies.findIndex(x=>x.res>0);
      if(next>=0){cb.idx=next;cb.enemies[next].roundsHere=0;toast(e.name+' è sconfitto. Ora affronti '+cb.enemies[next].name)}
      else{endCombat(c,'vittoria');toast('Vittoria: '+e.name+' è sconfitto')}
    }
  });
  const c2=C();if(r.again&&c2&&c2.combat&&c2.status==='alive')doRound(false);
}
function addFromSheet(){
  const g=id=>document.getElementById(id);const kind=g('skind').value;const name=g('sname').value.trim();
  if(!name){toast('Dai un nome all’oggetto');return}
  const it={id:uid(),kind,name,comb:num(g('scomb').value),res:num(g('sres').value),eq:false,note:g('snote').value.trim()};
  if(kind==='arma')it.wtype=g('swtype').value;
  if(kind==='armatura')it.atype=g('satype').value;
  if(kind==='faretra'){it.arrows=Math.min(6,Math.max(0,num(g('sarr').value)));it.comb=0;it.res=0}
  closeSheet();
  mutate(c=>{if(c.specials.length>=specialLimit(c)){toast('Hai già 12 Oggetti Speciali');return}
    withMaxDelta(c,()=>{c.specials.push(it);if(['armatura','elmo','scudo','altro'].includes(kind)){const err=eqCheck(c,it);if(!err)it.eq=true;else toast('Aggiunto ma non indossato: '+err)}})});
}
function eqCheck(c,it){
  const on=c.specials.filter(s=>s.eq&&s.id!==it.id);
  if(it.kind==='elmo'&&on.some(s=>s.kind==='elmo'))return 'puoi indossare un solo elmo';
  if(it.kind==='scudo'&&on.some(s=>s.kind==='scudo'))return 'puoi usare un solo scudo';
  if(it.kind==='armatura'){for(const s of on.filter(s=>s.kind==='armatura')){
    if(s.atype===it.atype&&it.atype!=='Altra armatura')return 'indossi già un’armatura dello stesso tipo';
    if(ARMOR_CLASH.some(([a,b])=>(a===s.atype&&b===it.atype)||(b===s.atype&&a===it.atype)))return it.atype+' non è compatibile con '+s.atype}}
  return null;
}

     logNotes(c);c.history.push(n);c.journal.push({k:'p',n});c.para={n,fought:false,lost:false};c.postCombat=false;
   })},
 'add-weapon':()=>{const type=document.getElementById('wtype').value;const name=document.getElementById('wname').value.trim()||type;mutate(c=>{if(c.weapons.length>=2)return;c.weapons.push({id:uid(),name,type})})},

 shoot:async d=>{const c=C();let bonus=0,why=[];
   if(d.k==='arco'){if(hasR(c,'guerra')&&c.guerra.includes('Arco')){bonus+=3;why.push('Guerra +3')}}

   const got=b<=4?w.ramas&&RAMAS.find(a=>a.id===w.ramas).n:b===5?w.rs.map(id=>RAMASTAN.find(a=>a.id===id).n).join(', '):b<=11&&w.rs[0]?RAMASTAN.find(a=>a.id===w.rs[0]).n:'';
   logNotes(c);c.journal.push({k:'e',txt:'Libro '+b+' completato'+(got?(b===5?'. Diventi Maestro Ramas, nuove Arti Ramastan: ':'. Nuova Arte: ')+got:''),t:Date.now()},{k:'b',book:b+1});
   c.book=b+1;c.phase='prep';c.para=null;c.history=[];c.healed=0;c.arciUsed=false;c.debt=0;c.postCombat=false;c.combat=null;c.resCur=maxRes(c);

 });UNDO=[];toast('Benvenuto nel libro '+C().book+': '+BOOKS[C().book])},

 'cr-draw':async d=>{const n=await drawFate(d.k==='comb'?'Combattività':'Resistenza',d.k==='comb'?'Il numero estratto più 10 è la tua COMBATTIVITÀ.':'Il numero estratto più 20 è la tua RESISTENZA.');if(n===null)return;UI.create[d.k]=String((d.k==='comb'?10:20)+n);render()},

     weapons:[],backpack:[],hasBackpack:true,gold:Math.min(50,num(r.gold)),currency:'Corone d’oro',specials:[],deposit:[],seized:null,

const slug=s=>s.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'personaggio';
async function exportJSON(list,filename){
  const data=JSON.stringify({app:'registro-di-guerra',v:1,exported:new Date().toISOString(),slots:list,settings:APP.settings},null,1);
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(!dl){await shareFile(filename,data);return}
    await dl.save({filename,data});toast('File esportato: salvalo in File, su iCloud Drive o Google Drive');
  }catch(e){if(e&&e.code==='declined')return;toast('Esportazione non riuscita')}
}
async function shareFile(filename,data){
  const file=new File([data],filename,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename});return}catch(e){if(e&&e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  toast('File esportato: salvalo in File, su iCloud Drive o Google Drive');
}
function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const o=JSON.parse(await f.text());const list=o.slots||(o.id?[o]:[]);if(!list.length)throw 0;
    let n=0;for(const s of list){if(!s||!s.id||!s.ramas)continue;const ex=APP.slots[s.id];if(ex&&(ex.updated||0)>(s.updated||0)&&!await confirmBox('Sovrascrivere '+s.name+'?','Sul dispositivo c’è una versione più recente di questo personaggio.','Sovrascrivi',true))continue;s.updated=Date.now();APP.slots[s.id]=s;CLOUD.pending.add(s.id);n++}
    if(n){APP.current=list[list.length-1].id;UNDO=[];persist(APP.current);render();toast(n===1?'Personaggio importato':n+' personaggi importati')}
  }catch(e){toast('Il file non è un salvataggio valido del Registro di Guerra')}};
  inp.click();
}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
let notesT=null;

  if(f==='notes'){const c=C();c.notes=e.target.value;clearTimeout(notesT);notesT=setTimeout(()=>{c.updated=Date.now();persist(c.id)},700);return}

  if(f==='cr-comb'){UI.create.comb=e.target.value;crBtn();return}
  if(f==='cr-res'){UI.create.res=e.target.value;crBtn();return}

});
document.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  if(f==='currency')mutate(c=>{c.currency=e.target.value});
  if(f==='notes'){const c=C();if(!c)return;c.notes=e.target.value;if(logNotes(c)){c.updated=Date.now();persist(c.id);const jp=document.getElementById('jprev');if(jp)jp.innerHTML=journalHtml(journalTail(c.journal))}}
  if(f==='pkind'){const k=e.target.value,inp=document.getElementById('pval'),lb=document.getElementById('pvl');
    const m={cura:['Punti RES','4'],alether:['Punti COMB','2']}[k];
    if(m){lb.textContent=m[0];inp.disabled=false;inp.placeholder='+'+m[1];inp.value=m[1]}else{lb.textContent='Nessun valore';inp.disabled=true;inp.value='';inp.placeholder=''}}
  if(f==='cr-sch'){UI.create.scherma=e.target.value;render()}
  if(f==='wz-sch'){UI.wiz.scherma=e.target.value;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pn')A.goto()});
